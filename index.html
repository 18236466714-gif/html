<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 游戏</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
  background: #faf8ef;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  user-select: none;
}

.container { max-width: 500px; width: 100%; padding: 15px; }

.header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
}

h1 { font-size: 72px; font-weight: 700; color: #776e65; line-height: 1; }

.scores { display: flex; gap: 5px; }

.score-box {
  background: #bbada0; border-radius: 6px; padding: 8px 20px;
  text-align: center; min-width: 80px;
}

.score-label { color: #eee4da; font-size: 12px; text-transform: uppercase; font-weight: 700; }
.score-value { color: #fff; font-size: 24px; font-weight: 700; }

.controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

.btn {
  background: #8f7a66; color: #f9f6f2; border: none; border-radius: 6px;
  padding: 12px 22px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.15s;
}
.btn:hover { background: #9f8b77; }
.btn:active { background: #7a6658; }

.game-board {
  position: relative; background: #bbada0; border-radius: 10px; padding: 10px;
  aspect-ratio: 1; margin-bottom: 15px;
}

.grid-bg {
  display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
  gap: 10px; width: 100%; height: 100%;
}

.cell { background: rgba(238, 228, 218, 0.35); border-radius: 6px; }

.tile-container { position: absolute; inset: 0; pointer-events: none; }

.tile {
  position: absolute; border-radius: 6px; display: flex; justify-content: center;
  align-items: center; font-weight: 700; transition: left 0.15s ease, top 0.15s ease; z-index: 1;
}

.tile-new  { animation: tile-appear 0.2s ease; }
.tile-merged { animation: tile-pop 0.2s ease; z-index: 2; }

@keyframes tile-appear {
  0%   { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes tile-pop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.25); }
  100% { transform: scale(1); }
}

.tile-2    { background: #eee4da; color: #776e65; }
.tile-4    { background: #ede0c8; color: #776e65; }
.tile-8    { background: #f2b179; color: #f9f6f2; }
.tile-16   { background: #f59563; color: #f9f6f2; }
.tile-32   { background: #f67c5f; color: #f9f6f2; }
.tile-64   { background: #f65e3b; color: #f9f6f2; }
.tile-128  { background: #edcf72; color: #f9f6f2; }
.tile-256  { background: #edcc61; color: #f9f6f2; }
.tile-512  { background: #edc850; color: #f9f6f2; }
.tile-1024 { background: #edc53f; color: #f9f6f2; }
.tile-2048 { background: #edc22e; color: #f9f6f2; }
.tile-4096 { background: #3c3a32; color: #f9f6f2; }
.tile-8192 { background: #3c3a32; color: #f9f6f2; }

.overlay {
  position: absolute; inset: 0; background: rgba(238, 228, 218, 0.73); border-radius: 10px;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  gap: 15px; z-index: 20;
}

.overlay-text { font-size: 48px; font-weight: 700; color: #776e65; }
.overlay .btn { font-size: 18px; padding: 14px 30px; }

.tip { color: #776e65; font-size: 15px; text-align: center; line-height: 1.6; }
.tip kbd {
  background: #eee4da; border: 1px solid #bbada0; border-radius: 4px;
  padding: 2px 7px; margin: 0 2px; font-family: inherit; font-size: 13px;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box"><div class="score-label">分数</div><div class="score-value" id="score">0</div></div>
      <div class="score-box"><div class="score-label">最高</div><div class="score-value" id="best">0</div></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="restart">🔄 重新开始</button>
  </div>

  <div class="game-board" id="board">
    <div class="grid-bg">
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>
    <div class="tile-container" id="tileContainer"></div>
  </div>

  <div class="tip">
    使用 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 方向键移动方块<br>
    相同数字合并，达到 <strong>2048</strong> 即获胜！
  </div>
</div>

<script>
class Game2048 {
  constructor() {
    this.size = 4;
    this.score = 0;
    this.best = parseInt(localStorage.getItem('best2048') || '0');
    this.gameOver = false;
    this.won = false;
    this.wonKeepPlaying = false;
    this.animating = false;

    // grid[r][c] = tileId | 0
    this.grid = Array.from({ length: this.size }, () => Array(this.size).fill(0));
    // tiles: Map<id, {id, value, row, col, el}>
    this.tiles = new Map();
    this.nextId = 1;

    this.boardEl = document.getElementById('board');
    this.tileContainer = document.getElementById('tileContainer');
    this.scoreEl = document.getElementById('score');
    this.bestEl = document.getElementById('best');

    this.addTile(true);
    this.addTile(true);
    this.updateScores();

    document.getElementById('restart').addEventListener('click', () => this.restart());
    document.addEventListener('keydown', (e) => this.onKey(e));

    // 触摸
    let tx = 0, ty = 0;
    this.boardEl.addEventListener('touchstart', (e) => {
      tx = e.touches[0].clientX; ty = e.touches[0].clientY;
    }, { passive: true });
    this.boardEl.addEventListener('touchend', (e) => {
      if (this.animating) return;
      const dx = e.changedTouches[0].clientX - tx;
      const dy = e.changedTouches[0].clientY - ty;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      if (Math.abs(dx) > Math.abs(dy)) {
        this.move(dx > 0 ? 'right' : 'left');
      } else {
        this.move(dy > 0 ? 'down' : 'up');
      }
    });

    window.addEventListener('resize', () => this.repositionAll());
  }

  /* ---------- 方块管理 ---------- */

  addTile(isInitial) {
    const empty = [];
    for (let r = 0; r < this.size; r++)
      for (let c = 0; c < this.size; c++)
        if (this.grid[r][c] === 0) empty.push([r, c]);
    if (empty.length === 0) return null;

    const [row, col] = empty[Math.floor(Math.random() * empty.length)];
    const value = Math.random() < 0.9 ? 2 : 4;
    const id = this.nextId++;

    const el = document.createElement('div');
    el.className = 'tile tile-' + value + (isInitial ? '' : ' tile-new');
    el.textContent = value;
    this.tileContainer.appendChild(el);

    const tile = { id, value, row, col, el };
    this.tiles.set(id, tile);
    this.grid[row][col] = id;
    this.positionTile(tile);
    return tile;
  }

  positionTile(tile) {
    const size = this.cellSize(), gap = this.gapSize(), pad = this.paddingSize();
    tile.el.style.width = size + 'px';
    tile.el.style.height = size + 'px';
    tile.el.style.left = (pad + tile.col * (size + gap)) + 'px';
    tile.el.style.top  = (pad + tile.row * (size + gap)) + 'px';
    const fs = tile.value >= 1024 ? 24 : tile.value >= 128 ? 30 : 36;
    tile.el.style.fontSize = fs + 'px';
    tile.el.style.lineHeight = size + 'px';
  }

  removeTile(id) {
    const t = this.tiles.get(id);
    if (t && t.el) t.el.remove();
    this.tiles.delete(id);
  }

  repositionAll() {
    for (const t of this.tiles.values()) this.positionTile(t);
  }

  /* ---------- 尺寸 ---------- */

  cellSize() {
    const w = this.boardEl.clientWidth;
    const gap = this.gapSize(), pad = this.paddingSize();
    return (w - pad * 2 - gap * (this.size - 1)) / this.size;
  }
  gapSize()    { return Math.max(6, this.boardEl.clientWidth * 0.02); }
  paddingSize(){ return Math.max(6, this.boardEl.clientWidth * 0.02); }

  /* ---------- 移动 ---------- */

  onKey(e) {
    const map = {
      ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
      w:'up', s:'down', a:'left', d:'right',
      W:'up', S:'down', A:'left', D:'right',
    };
    const dir = map[e.key];
    if (dir) { e.preventDefault(); if (!this.animating) this.move(dir); }
  }

  move(dir) {
    if (this.gameOver) return;
    if (this.won && !this.wonKeepPlaying) return;
    if (this.animating) return;

    // 旧值快照——用于最终判断是否真的移动了
    const oldValues = this.grid.map(r => r.map(id =>
      id === 0 ? 0 : (this.tiles.get(id)?.value || 0)
    ));

    // 方向 → 顺时针旋转次数（把目标方向转到"左侧"来统一压缩）
    // 推导：1*CW 使原图"下"变成旋转后"左"; 2*CW→"右"变"左"; 3*CW→"上"变"左"
    const rots = { up: 3, right: 2, down: 1, left: 0 };
    const rot = rots[dir];

    // 构建 tile 指针矩阵并旋转
    let cells = this.grid.map(r => r.map(id => id === 0 ? null : this.tiles.get(id)));
    cells = this.rotateCells(cells, rot);

    const mergePairs = []; // [{newId, value, fromIds}]

    // 逐行向左压缩 + 合并
    for (let r = 0; r < this.size; r++) {
      const row = cells[r].filter(c => c !== null);
      const result = [];
      let i = 0;
      while (i < row.length) {
        if (i + 1 < row.length && row[i].value === row[i + 1].value) {
          const newId = this.nextId++;
          const val = row[i].value * 2;
          mergePairs.push({ newId, value: val, fromIds: [row[i].id, row[i + 1].id] });
          this.score += val;
          result.push({ id: newId, value: val, isMerge: true });
          i += 2;
        } else {
          result.push({ id: row[i].id, value: row[i].value, isMerge: false });
          i++;
        }
      }
      while (result.length < this.size) result.push(null);
      cells[r] = result;
    }

    // 旋转回来
    cells = this.rotateCells(cells, (4 - rot) % 4);

    // 构建新 grid 并比较值——没变就说明无法移动
    const newGrid = Array.from({ length: this.size }, () => Array(this.size).fill(0));
    const newValues = Array.from({ length: this.size }, () => Array(this.size).fill(0));
    for (let r = 0; r < this.size; r++) {
      for (let c = 0; c < this.size; c++) {
        if (cells[r][c]) {
          newGrid[r][c] = cells[r][c].id;
          newValues[r][c] = cells[r][c].value;
        }
      }
    }

    let moved = false;
    for (let r = 0; r < this.size && !moved; r++)
      for (let c = 0; c < this.size && !moved; c++)
        if (oldValues[r][c] !== newValues[r][c]) moved = true;

    if (!moved) {
      // 回滚提前加上的合并分数
      for (const p of mergePairs) this.score -= p.value;
      return;
    }

    this.animating = true;

    // 移除合并掉的旧方块 DOM
    for (const p of mergePairs)
      for (const fid of p.fromIds) this.removeTile(fid);

    // 更新 / 创建 DOM
    for (let r = 0; r < this.size; r++) {
      for (let c = 0; c < this.size; c++) {
        const cell = cells[r][c];
        if (!cell) continue;
        if (cell.isMerge) {
          const el = document.createElement('div');
          const v = cell.value;
          el.className = 'tile tile-' + (v <= 8192 ? v : 8192) + ' tile-merged';
          el.textContent = v;
          this.tileContainer.appendChild(el);
          const tile = { id: cell.id, value: v, row: r, col: c, el };
          this.tiles.set(cell.id, tile);
          this.positionTile(tile);
        } else {
          const tile = this.tiles.get(cell.id);
          if (tile) {
            tile.row = r; tile.col = c; tile.value = cell.value;
            this.positionTile(tile);
            const v = cell.value;
            tile.el.className = 'tile tile-' + (v <= 8192 ? v : 8192);
            tile.el.textContent = v;
          }
        }
      }
    }

    this.grid = newGrid;

    // 清理动画 class
    setTimeout(() => {
      for (const t of this.tiles.values())
        t.el.classList.remove('tile-new', 'tile-merged');
    }, 200);

    // 新方块
    setTimeout(() => {
      this.addTile(false);
      this.updateScores();
      this.checkState();
      this.animating = false;
    }, 50);
  }

  /* 顺时针旋转 n*90° */
  rotateCells(cells, times) {
    let g = cells.map(r => [...r]);
    for (let t = 0; t < times; t++) {
      const n = Array.from({ length: this.size }, () => Array(this.size).fill(null));
      for (let r = 0; r < this.size; r++)
        for (let c = 0; c < this.size; c++)
          n[c][this.size - 1 - r] = g[r][c];
      g = n;
    }
    return g;
  }

  /* ---------- 状态 ---------- */

  checkState() {
    if (!this.won && !this.wonKeepPlaying) {
      for (let r = 0; r < this.size; r++)
        for (let c = 0; c < this.size; c++)
          if (this.grid[r][c] !== 0 && this.tiles.get(this.grid[r][c])?.value >= 2048) {
            this.won = true;
            this.showOverlay('🎉 你赢了！', '继续玩', () => this.keepPlaying());
            return;
          }
    }

    let canMove = false;
    for (let r = 0; r < this.size && !canMove; r++) {
      for (let c = 0; c < this.size && !canMove; c++) {
        if (this.grid[r][c] === 0) { canMove = true; break; }
        const v = this.tiles.get(this.grid[r][c])?.value || 0;
        if (r + 1 < this.size && (this.tiles.get(this.grid[r + 1][c])?.value || 0) === v) canMove = true;
        if (c + 1 < this.size && (this.tiles.get(this.grid[r][c + 1])?.value || 0) === v) canMove = true;
      }
    }
    if (!canMove) {
      this.gameOver = true;
      this.showOverlay('😞 游戏结束', '再来一局', () => this.restart());
    }
  }

  keepPlaying() { this.wonKeepPlaying = true; this.removeOverlay(); }

  updateScores() {
    this.scoreEl.textContent = this.score;
    if (this.score > this.best) {
      this.best = this.score;
      localStorage.setItem('best2048', this.best.toString());
    }
    this.bestEl.textContent = this.best;
  }

  /* ---------- 覆盖层 ---------- */

  showOverlay(text, btnText, cb) {
    this.removeOverlay();
    const el = document.createElement('div');
    el.className = 'overlay'; el.id = 'overlay';
    el.innerHTML = '<div class="overlay-text">' + text + '</div>' +
      '<button class="btn" id="overlayBtn">' + btnText + '</button>';
    this.boardEl.appendChild(el);
    document.getElementById('overlayBtn').addEventListener('click', cb);
  }
  removeOverlay() { const e = document.getElementById('overlay'); if (e) e.remove(); }

  /* ---------- 重置 ---------- */

  restart() {
    this.removeOverlay();
    for (const id of this.tiles.keys()) this.removeTile(id);
    this.tiles.clear();
    this.grid = Array.from({ length: this.size }, () => Array(this.size).fill(0));
    this.score = 0; this.gameOver = false; this.won = false;
    this.wonKeepPlaying = false; this.animating = false; this.nextId = 1;
    this.addTile(true); this.addTile(true); this.updateScores();
  }
}

window.game = new Game2048();
</script>
</body>
</html>
